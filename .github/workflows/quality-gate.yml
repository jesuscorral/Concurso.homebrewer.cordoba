# Reusable quality gate shared by the PR and production pipelines.
# Builds the site ONCE and publishes it as the `dist` artifact: every later
# job (e2e, Lighthouse, preview deploy, production deploy) uses that exact build.
# See docs/DEPLOYMENT.md.
name: Quality gate (reusable)

on:
  workflow_call:
    inputs:
      ref:
        description: Commit SHA or tag to build for a rollback (empty = the commit that triggered the run). Must already be on master.
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  quality:
    name: Audit, lint, unit tests & build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: ${{ inputs.ref == '' && 1 || 0 }}
          persist-credentials: false

      # Rollbacks may only deploy commits that already went through master.
      - name: Verify ref belongs to master
        if: inputs.ref != ''
        run: |
          git fetch --no-tags origin master
          if ! git merge-base --is-ancestor HEAD origin/master; then
            echo "::error::The requested ref is not part of master. Only commits already merged to master can be deployed."
            exit 1
          fi

      # The npm cache is only used for normal runs: a run on an explicit ref
      # (rollback) never reads or writes the shared cache, so it cannot poison it.
      - name: Setup Node (with npm cache)
        if: inputs.ref == ''
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup Node (no cache, explicit ref)
        if: inputs.ref != ''
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test -- --coverage

      - name: Build (production)
        run: npm run build

      - name: Upload build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist
          retention-days: 7

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage
          retention-days: 7
