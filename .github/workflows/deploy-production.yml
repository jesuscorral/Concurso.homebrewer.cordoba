# Stage 2 of the deployment strategy: every merge to master is released to
# production automatically. It can also be run by hand (Actions → Run workflow)
# to redeploy the current master. Rollbacks: see docs/DEPLOYMENT.md.
#
# Every job calls a shared workflow from jesuscorral/reusable-workflows,
# pinned to a release commit (Dependabot proposes upgrades).
# See docs/DEPLOYMENT.md.
name: Production · Deploy to Firebase Hosting

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

# Never two production deploys in parallel; a newer run waits for the current one.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  quality:
    name: 1 · Quality gate
    uses: jesuscorral/reusable-workflows/.github/workflows/node-quality-gate.yml@ccdb32501d50552508779281fdbd13e61c193a54 # feat/web-delivery-workflows

  # SonarCloud only analyses master (PR analysis is disabled, see docs/DEPLOYMENT.md).
  sonarcloud:
    name: 2 · SonarCloud analysis (master)
    needs: quality
    uses: jesuscorral/reusable-workflows/.github/workflows/sonarcloud-analysis.yml@ccdb32501d50552508779281fdbd13e61c193a54 # feat/web-delivery-workflows
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  deploy:
    name: 3 · Deploy to production (live channel)
    needs: quality
    uses: jesuscorral/reusable-workflows/.github/workflows/firebase-hosting-deploy-live.yml@507a5046f317e76b3e0b6a5faf5db72d4c51f0c2 # feat/web-delivery-workflows
    with:
      firebase-project-id: concursohomebrewercordob-6d540
      site-url: https://www.concursohomebrewercordoba.es/
    secrets:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CONCURSOHOMEBREWERCORDOB_6D540 }}

  smoke:
    name: 4 · Smoke test production
    needs: deploy
    uses: jesuscorral/reusable-workflows/.github/workflows/http-smoke-test.yml@ccdb32501d50552508779281fdbd13e61c193a54 # feat/web-delivery-workflows
    with:
      base-url: https://www.concursohomebrewercordoba.es
      paths: / /rules /awards /registration
      expected-text: Concurso Homebrewer
      failure-hint: >-
        Production smoke test failed. Roll back now from the Firebase console
        (Hosting → Release history → Roll back), then open a PR with 'git revert'
        of the faulty commit (see docs/DEPLOYMENT.md, Rollback).
