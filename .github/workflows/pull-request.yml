# Stage 1 of the deployment strategy: validate every pull request and publish
# a temporary preview of the site. Nothing here touches production.
#
# Every job calls a shared workflow from jesuscorral/reusable-workflows,
# pinned to a release commit (Dependabot proposes upgrades).
# See docs/DEPLOYMENT.md.
name: PR · Validate & preview

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

# A new push to the PR cancels the runs still in progress for that PR.
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  quality:
    name: 1 · Quality gate
    uses: jesuscorral/reusable-workflows/.github/workflows/node-quality-gate.yml@ccdb32501d50552508779281fdbd13e61c193a54 # feat/web-delivery-workflows

  e2e:
    name: 2 · E2E tests (Chromium, Firefox, WebKit)
    needs: quality
    uses: jesuscorral/reusable-workflows/.github/workflows/node-playwright-e2e.yml@ccdb32501d50552508779281fdbd13e61c193a54 # feat/web-delivery-workflows

  lighthouse:
    name: 2 · Lighthouse audit
    needs: quality
    uses: jesuscorral/reusable-workflows/.github/workflows/web-lighthouse-audit.yml@ccdb32501d50552508779281fdbd13e61c193a54 # feat/web-delivery-workflows

  preview:
    name: 3 · Deploy preview (Firebase channel, 7 days)
    needs: [quality, e2e]
    # Secrets are not available to PRs from forks.
    if: github.event.pull_request.head.repo.fork == false
    permissions:
      contents: read
      checks: write
      pull-requests: write
    uses: jesuscorral/reusable-workflows/.github/workflows/firebase-hosting-deploy-preview.yml@ccdb32501d50552508779281fdbd13e61c193a54 # feat/web-delivery-workflows
    with:
      firebase-project-id: concursohomebrewercordob-6d540
      expires: 7d
    secrets:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CONCURSOHOMEBREWERCORDOB_6D540 }}
